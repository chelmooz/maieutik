# cargo-deny configuration for Maieutik

[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "x86_64-apple-darwin"]
all-features = true

[output]
feature-depth = 2

[advisories]
db-path = "$CARGO_HOME/advisory-dbs"
db-urls = ["https://github.com/rustsec/advisory-db"]
# Ignore advisories with no safe upgrade available (transitive deps: egui, zbus, etc.)
ignore = [
    # bincode unmaintained (via laya-primitives, sled) - no safe upgrade
    "RUSTSEC-2025-0141",
    # fxhash unmaintained (via sled) - no safe upgrade
    "RUSTSEC-2025-0057",
    # instant unmaintained (via parking_lot/sled) - no safe upgrade
    "RUSTSEC-2024-0384",
    # lru unsound (IterMut) - upgrade to >=0.16.3 available but may break API
    "RUSTSEC-2026-0002",
    # lru unsound (pop panic safety) - upgrade to >=0.18.2 available
    "RUSTSEC-2026-0253",
    # paste unmaintained (via accesskit/tokenizers) - no safe upgrade
    "RUSTSEC-2024-0436",
    # protobuf vulnerability (via prometheus/laya-primitives) - upgrade to >=3.7.2
    "RUSTSEC-2024-0437",
    # quick-xml vulnerabilities (via zbus_xml) - upgrade to >=0.41.0
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # ttf-parser unmaintained (via lopdf/ab_glyph) - no safe upgrade
    "RUSTSEC-2026-0192",
    # zbus_names unmaintained (merged into zbus 6.0) - no safe upgrade
    "RUSTSEC-2026-0371",
    # zvariant unmaintained (merged into zbus 6.0) - no safe upgrade
    "RUSTSEC-2026-0370",
    # zvariant_derive unmaintained (merged into zbus 6.0) - no safe upgrade
    "RUSTSEC-2026-0372",
]
git-fetch-with-cli = true

[licenses]
# Allow all licenses used in the project (permissive/OSI-approved)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
    "0BSD",
    "MIT-0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "OFL-1.1",
    "LicenseRef-UFL-1.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
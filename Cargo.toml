[workspace]
resolver = "2"
members = [
    "maieutik",
    "laya-primitives",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Michel Husson"]
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
parking_lot = "0.12"
dashmap = "5.5"
half = "2.5"
bytemuck = "1.16"
rayon = "1.10"
prometheus = "0.13"
ort = { version = "2.0.0-rc.15", features = ["load-dynamic"] }
tokenizers = "0.19"
ndarray = { version = "0.17", features = ["std"] }
schemars = "0.8"
once_cell = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
criterion = "0.5"
proptest = "1"
tempfile = "3"
tokio-test = "0.4"

[workspace.dev-dependencies]
tempfile = "3"
proptest = "1"
tokio-test = "0.4"
pretty_assertions = "1"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[profile.dev]
debug = true
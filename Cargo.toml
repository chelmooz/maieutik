[package]
name = "maieutik"
version = "0.1.0"
edition = "2021"
description = "Maieutik — local-first notes with AI"
license = "MIT"
repository = "https://github.com/chelmooz/maieutik"
authors = ["Michel Husson"]
rust-version = "1.99"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[profile.dev]
debug = true

[features]
default = []  # CPU by default; enable "cuda"/"vulkan"/"metal" explicitly
# egui-ui = ["egui", "egui-wgpu", "egui-winit", "winit", "wgpu"]
# tauri-ui = ["tauri", "tauri-plugin-dialog", "tauri-plugin-fs", "tauri-plugin-shell", "tauri-plugin-updater"]
cuda = ["llama-cpp-2/cuda"]
metal = ["llama-cpp-2/metal"]
vulkan = ["llama-cpp-2/vulkan"]
full = ["cuda", "vulkan"]

[dependencies]
# Core
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
directories = "2"
serde_json = "1"
bincode = "1"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
futures = "0.3"
once_cell = "1"
parking_lot = "0.12"
async-trait = "0.1"

# Config & Secrets
config = { version = "0.14", features = ["json"] }
dirs = "5"
keyring = "4.2"

# File Watching
notify = { version = "6", features = ["mio"] }
walkdir = "2"

# Embedded DB
sled = "0.34"

# Vector Search
fast-hnsw = "1.0"

# ONNX Runtime
ort = { version = "2.0.0-rc.15", features = ["api-31", "load-dynamic", "ndarray"] }

# LLM - llama.cpp bindings
llama-cpp-2 = { version = "0.1", features = [] }  # features set via crate features

# STT - sherpa-onnx
sherpa-onnx = { version = "1.13", features = ["static"] }

# VAD - use ort directly (no silero_vad crate - incompatible with ort 2.x)

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "cookies"] }

# MCP / JSON-RPC
jsonrpsee = { version = "0.26", features = ["server", "client", "macros"] }

# UI - egui (immediate mode, pure Rust) - disabled for now due to version conflicts
# egui = { version = "0.28", features = ["accesskit", "persistence", "default_fonts"], optional = true }
# egui-wgpu = { version = "0.28", optional = true }
# egui-winit = { version = "0.28", optional = true }
# winit = { version = "0.28", features = ["serde"], optional = true }
# wgpu = { version = "21", features = ["vulkan-portability"], optional = true }

url = "2"

# Document Processing
docx-rs = "0.3"
pdf-extract = "0.7"
zip = "0.6"

# Spell/Thesaurus

# Graph


# Markdown

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# Updater


# CLI
clap = { version = "4", features = ["derive", "env"] }

# Global Hotkeys


# Single instance (cross-platform)
single-instance = "0.1"

# Audio (for meeting recording)

hound = "3.5"  # WAV writing

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
blake3 = "1"
base64 = "0.22"
percent-encoding = "2.3"


ndarray = "0.17"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
pretty_assertions = "1"

[build-dependencies]

reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

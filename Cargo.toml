[workspace]
resolver = "2"
members = ["maieutik", "laya-primitives", "maieutik-ui", "maieutik-api"]

[workspace.package]
edition = "2021"
rust-version = "1.99"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"
tokio = { version = "1", features = ["full", "rt-multi-thread"] }
futures = "0.3"
once_cell = "1"
parking_lot = "0.12"
async-trait = "0.1"
directories = "5"
config = { version = "0.14", features = ["json"] }
notify = { version = "6", features = ["mio"] }
walkdir = "2"
sled = "0.34"
fast-hnsw = "1.0"
ort = { version = "2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "tracing", "api-31", "load-dynamic"] }
llama-cpp-2 = { version = "0.1", features = [] }
rand = "0.8"
pdf-extract = "0.12"
zip = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"
proptest = "1"
pretty_assertions = "1"
criterion = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
clap = { version = "4", features = ["derive", "env"] }
single-instance = "0.3.3"
hound = "3.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
cc = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
blake3 = "1"
base64 = "0.22"
percent-encoding = "2.3"
ndarray = "0.17"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
chacha20poly1305 = "0.10"
keyring = "4"
schemars = "0.8"
jsonrpsee = { version = "0.26", features = ["server", "client", "ws-client", "http-client", "tokio", "macros"] }
dirs = "5"
tokio-stream = { version = "0.1", features = ["sync"] }
eframe = { version = "0.30", default-features = false, features = ["persistence", "accesskit", "glow", "x11", "wayland"] }
egui = { version = "0.30", features = ["accesskit", "persistence", "default_fonts"] }
prometheus = "0.13"
wiremock = "0.6"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = "z"

[profile.release-debug]
inherits = "release"
strip = false
debug = true

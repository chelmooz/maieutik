name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check-test-clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cpal is compiled with the `jack` feature: libjack + alsa headers are
      # needed on the runner (jack-sys build script panics without them).
      - name: install system libs (jack, alsa, pkg-config)
        run: sudo apt-get update && sudo apt-get install -y libjack-dev libasound2-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo check --locked --all-targets
        run: cargo check --locked --all-targets

      # Model-dependent tests are #[ignore]d by design (they need the BGE-M3
      # files and libonnxruntime) and stay out of CI on purpose.
      - name: cargo test --locked (model-independent)
        run: cargo test --locked

      # Warnings are listed, not blocking: the full baseline is committed at
      # docs/clippy-baseline.txt (54 warnings, captured on this tree).
      # Switching to -D warnings is planned once they are cleaned up.
      - name: cargo clippy --locked --all-targets (non-blocking)
        run: cargo clippy --locked --all-targets

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # NON-BLOCKING by gatekeeper decision: 20 advisories remain after the
      # P1.5 pruning (10 vulnerabilities: lopdf via pdf-extract, zip 0.5/0.6/2.6;
      # 10 warnings: failure, instant, paste, adler, fxhash, bincode, the zbus
      # stack via keyring). Full list in the P1.5 report — owner decides the
      # treatment of the remaining crates (pdf-extract/docx-rs are needed until
      # the P3 extraction rewrite, bincode until the SQLite move).
      - name: cargo audit (non-blocking — advisories in deps slated for pruning)
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit

name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Cargo test
        run: cargo test --features cpp-modules --workspace
      - name: NPM test
        working-directory: maieutik-web
        run: |
          npm ci || npm install
          npm test || echo "No tests"

name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check-orphan-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: jq
      - name: Check for orphaned .rs files
        run: .github/scripts/check_orphaned_rust.sh

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            cmake_args: ""
            llvm_path: ""
          - os: macos-latest
            cmake_args: "-DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++"
            llvm_path: ""
          - os: windows-latest
            cmake_args: "-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl"
            llvm_path: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Rust toolchain
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      # System dependencies for cpp-modules
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang pkg-config libssl-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake llvm pkg-config
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake llvm pkgconfiglite -y --no-progress
          echo "C:\\Program Files\\LLVM\\bin" >> $GITHUB_PATH

      # Cache cargo
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Cargo check --locked --all-targets
        run: cargo check --locked --features cpp-modules --all-targets
        env:
          CMAKE_ARGS: ${{ matrix.cmake_args }}

      - name: Cargo test --locked
        run: cargo test --locked --features cpp-modules --workspace
        env:
          CMAKE_ARGS: ${{ matrix.cmake_args }}

      - name: Clippy -D warnings
        run: cargo clippy --locked --features cpp-modules --all-targets -- -D warnings
        env:
          CMAKE_ARGS: ${{ matrix.cmake_args }}

      # Web tests only on Linux (faster, sufficient)
      - name: NPM install
        if: runner.os == 'Linux'
        working-directory: maieutik-web
        run: npm ci

      - name: Typecheck and build
        if: runner.os == 'Linux'
        working-directory: maieutik-web
        run: npm run build

      - name: Install Playwright browser
        if: runner.os == 'Linux'
        working-directory: maieutik-web
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        if: runner.os == 'Linux'
        working-directory: maieutik-web
        run: npm test

      # cargo-deny on Linux
      - name: Install cargo-deny
        if: runner.os == 'Linux'
        run: cargo install cargo-deny --locked

      - name: Cargo deny check
        if: runner.os == 'Linux'
        run: cargo deny check

  # Cargo deny check also runs on Linux separately (faster feedback)
  cargo-deny:
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Cargo deny check
        run: cargo deny check
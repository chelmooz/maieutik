name: CI

on: [push, pull_request]

permissions:
  contents: read  # restrict scope for checkout token

jobs:
  check-orphan-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: jq  # for the orphan-finding gate
      - name: Check for orphaned .rs files
        run: .github/scripts/check_orphaned_rust.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Cargo check --locked --all-targets
        run: cargo check --locked --features cpp-modules --all-targets
      - name: Cargo test --locked
        run: cargo test --locked --features cpp-modules --workspace
      - name: Clippy -D warnings
        run: cargo clippy --locked --features cpp-modules --all-targets -- -D warnings
      - name: NPM install
        working-directory: maieutik-web
        run: npm ci
      - name: Typecheck and build
        working-directory: maieutik-web
        run: npm run build
      - name: Install Playwright browser
        working-directory: maieutik-web
        run: npx playwright install --with-deps chromium
      - name: Playwright tests
        working-directory: maieutik-web
        run: npm test

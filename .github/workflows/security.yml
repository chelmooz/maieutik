name: Security

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Vérifier les dépendances chaque jour
    - cron: '0 3 * * *'

jobs:
  dependabot:
    name: Dependabot Alerts
    runs-on: ubuntu-latest
    steps:
      - name: Check Dependabot
        run: echo "Dependabot alerts configured in repository settings"

  audit:
    name: Cargo Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
      
      - name: Run audit
        run: cargo audit